<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Paciente</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --error-bg: #fef2f2;
            --error-border: #ef4444;
            --error-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 540px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .header-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            background-color: var(--primary-light);
            padding: 4px 10px;
            border-radius: 9999px;
            margin-bottom: 8px;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-header p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .error-cont {
            background-color: var(--error-bg);
            border-left: 4px solid var(--error-border);
            color: var(--error-text);
            padding: 14px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #fff;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <main class="card">
        <header class="card-header">
            <span class="header-badge">Modo Edición</span>
            <h2>Editar paciente</h2>
            <p id="subtituloModo">Cargando datos...</p>
        </header>

        <div id="error-cont" class="error-cont" role="alert" style="display: none;">
            <strong>Se produjo un error:</strong>
            <p id="error-texto"></p>
        </div>

        <p id="mensaje-carga" style="margin-bottom: 20px;">Obteniendo información del paciente...</p>

        <form id="formEditarPaciente" hidden>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="rut">RUT</label>
                    <input type="text" id="rut" name="rut" maxlength="12" required>
                </div>

                <div class="form-group full-width">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" maxlength="100" required>
                </div>

                <div class="form-group full-width">
                    <label for="fecha_nacim">Fecha de nacimiento</label>
                    <input type="date" id="fecha_nacim" name="fecha_nacim" required>
                </div>

                <div class="form-group full-width">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" maxlength="200" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" maxlength="20" required>
                </div>

                <div class="form-group">
                    <label for="prevision">Previsión</label>
                    <select id="prevision" name="prevision" required>
                        <option value="fonasa a">Fonasa A</option>
                        <option value="fonasa b">Fonasa B</option>
                        <option value="isapre">Isapre</option>
                        <option value="ninguna">Ninguna</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn-primary">Guardar cambios</button>
                <a href="/listar_paciente/" class="btn-secondary">↩ Cancelar</a>
            </div>
        </form>
    </main>

    <script>
        const token = sessionStorage.getItem('token');
        const partesURL = window.location.pathname.split('/').filter(Boolean);
        const pacienteId = partesURL[partesURL.length - 1];

        const formulario = document.getElementById('formEditarPaciente');
        const mensajeCarga = document.getElementById('mensaje-carga');
        const errorCont = document.getElementById('error-cont');
        const errorTexto = document.getElementById('error-texto');
        const subtituloModo = document.getElementById('subtituloModo');

        async function cargarDatosPaciente() {
            if (!token) {
                window.location.href = '/';
                return;
            }

            try {
                const respuesta = await fetch(`/api/hospital/${pacienteId}/`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Token ${token}`
                    }
                });

                if (respuesta.status === 401 || respuesta.status === 403) {
                    sessionStorage.removeItem('token');
                    window.location.href = '/';
                    return;
                }

                if (!respuesta.ok) {
                    throw new Error('No se pudo cargar el paciente.');
                }

                const paciente = await respuesta.json();

                document.getElementById('rut').value = paciente.rut;
                document.getElementById('nombre').value = paciente.nombre;
                document.getElementById('fecha_nacim').value = paciente.fecha_nacimiento;
                document.getElementById('direccion').value = paciente.direccion;
                document.getElementById('telefono').value = paciente.telefono;
                document.getElementById('prevision').value = paciente.prevision.toLowerCase();

                subtituloModo.innerHTML = `Modificando el registro de <strong>${paciente.nombre}</strong>`;
                mensajeCarga.style.display = 'none';
                formulario.hidden = false;

            } catch (error) {
                mensajeCarga.textContent = error.message;
                mensajeCarga.style.color = '#dc2626';
                console.error(error);
            }
        }

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();
            errorCont.style.display = 'none';

            const datosActualizados = {
                rut: document.getElementById('rut').value.trim(),
                nombre: document.getElementById('nombre').value.trim(),
                fecha_nacimiento: document.getElementById('fecha_nacim').value,
                direccion: document.getElementById('direccion').value.trim(),
                telefono: document.getElementById('telefono').value.trim(),
                prevision: document.getElementById('prevision').value
            };

            try {
                const respuesta = await fetch(`/api/hospital/${pacienteId}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify(datosActualizados)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    window.location.href = '/listar_paciente/';
                } else {
                    errorTexto.textContent = datos.error || 'No se pudo actualizar el paciente.';
                    errorCont.style.display = 'block';
                }

            } catch (error) {
                errorTexto.textContent = 'Error de conexión con el servidor.';
                errorCont.style.display = 'block';
                console.error(error);
            }
        });

        cargarDatosPaciente();
    </script>
</body>
</html>
