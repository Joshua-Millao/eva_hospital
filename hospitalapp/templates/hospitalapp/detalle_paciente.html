<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Paciente</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 540px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding-bottom: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .profile-title span {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
        }

        .profile-title h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .badge-prevision {
            background-color: var(--primary-light);
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 9999px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        .info-item {
            background-color: #f8fafc;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .full-width {
            grid-column: span 2;
        }

        .info-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 4px;
            display: block;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            word-break: break-word;
        }

        .actions {
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-decoration: none;
            background-color: #f1f5f9;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .btn-back:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <main class="card">
        <p id="mensaje-carga" style="text-align: center;">Cargando información del paciente...</p>

        <div id="contenido-detalle" hidden>
            <header class="profile-header">
                <div class="profile-title">
                    <span>Ficha del Paciente</span>
                    <h2 id="nombrePaciente"></h2>
                </div>
                <span class="badge-prevision" id="previsionBadge"></span>
            </header>

            <section class="info-grid">
                <div class="info-item">
                    <span class="info-label">RUT</span>
                    <p class="info-value" id="rutPaciente"></p>
                </div>

                <div class="info-item">
                    <span class="info-label">Fecha de nacimiento</span>
                    <p class="info-value" id="fechaNacimiento"></p>
                </div>

                <div class="info-item">
                    <span class="info-label">Teléfono</span>
                    <p class="info-value" id="telefonoPaciente"></p>
                </div>

                <div class="info-item">
                    <span class="info-label">Previsión</span>
                    <p class="info-value" id="previsionPaciente" style="text-transform: capitalize;"></p>
                </div>

                <div class="info-item full-width">
                    <span class="info-label">Dirección</span>
                    <p class="info-value" id="direccionPaciente"></p>
                </div>
            </section>
        </div>

        <footer class="actions">
            <a href="/listar_paciente/" class="btn-back">↩ Volver al listado de pacientes</a>
        </footer>
    </main>

    <script>
        const token = sessionStorage.getItem('token');
        const partesURL = window.location.pathname.split('/').filter(Boolean);
        const pacienteId = partesURL[partesURL.length - 1];

        const mensajeCarga = document.getElementById('mensaje-carga');
        const contenidoDetalle = document.getElementById('contenido-detalle');

        async function cargarDetalle() {
            if (!token) {
                window.location.href = '/';
                return;
            }

            try {
                const respuesta = await fetch(`/api/hospital/${pacienteId}/`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Token ${token}`
                    }
                });

                if (respuesta.status === 401 || respuesta.status === 403) {
                    sessionStorage.removeItem('token');
                    window.location.href = '/';
                    return;
                }

                if (!respuesta.ok) {
                    throw new Error('No se pudo cargar la información del paciente.');
                }

                const paciente = await respuesta.json();

                document.getElementById('nombrePaciente').textContent = paciente.nombre;
                document.getElementById('previsionBadge').textContent = paciente.prevision;
                document.getElementById('rutPaciente').textContent = paciente.rut;
                document.getElementById('fechaNacimiento').textContent = paciente.fecha_nacimiento;
                document.getElementById('telefonoPaciente').textContent = paciente.telefono;
                document.getElementById('previsionPaciente').textContent = paciente.prevision;
                document.getElementById('direccionPaciente').textContent = paciente.direccion;

                mensajeCarga.style.display = 'none';
                contenidoDetalle.hidden = false;

            } catch (error) {
                mensajeCarga.textContent = error.message;
                mensajeCarga.style.color = '#dc2626';
                console.error(error);
            }
        }

        cargarDetalle();
    </script>
</body>
</html>
