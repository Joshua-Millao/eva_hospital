<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Clínico</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --error-bg: #fee2e2;
            --error-border: #fecaca;
            --error-text: #b91c1c;
            --success-bg: #dcfce7;
            --success-border: #bbf7d0;
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
        }

        /* TARJETA DE LOGIN */
        .contenedor-login {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        /* LOGO / INSIGNIA CLÍNICA */
        .login-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            background-color: var(--primary-light);
            padding: 4px 10px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }

        h1 {
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitulo {
            margin-bottom: 24px;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* FORMULARIO */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            color: var(--text-main);
            font-size: 0.875rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:hover {
            border-color: #93c5fd;
        }

        input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* BOTÓN DE ACCESO */
        button {
            width: 100%;
            margin-top: 8px;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: translateY(1px);
        }

        button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }

        /* MENSAJES DE RESPUESTA */
        #mensaje {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            overflow-wrap: anywhere;
        }

        #mensaje:empty {
            display: none;
        }

        #mensaje.exito {
            color: var(--success-text);
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
        }

        #mensaje.error {
            color: var(--error-text);
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .contenedor-login {
                padding: 30px 22px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <main class="contenedor-login">
        <span class="login-badge">Portal Clínico</span>
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">
            Ingrese sus credenciales de acceso para administrar el sistema de pacientes.
        </p>

        <form id="formLogin">
            <!-- Si usas autenticación tradicional de Django por POST clásico, puedes incluir {% csrf_token %} aquí -->
            
            <div class="form-group">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ej: doctor_admin"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Ingresar al sistema</button>
        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>
    </main>

    <script>
        const formulario = document.getElementById('formLogin');
        const mensaje = document.getElementById('mensaje');

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            mensaje.textContent = '';
            mensaje.className = '';

            try {
                // Puedes ajustar la URL según tu endpoint de login en Django
                const respuesta = await fetch('/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    sessionStorage.setItem('token', datos.token);

                    mensaje.textContent = 'Inicio de sesión correcto. Redirigiendo...';
                    mensaje.className = 'exito';

                    // Redirección adaptada al dashboard principal de pacientes
                    setTimeout(() => {
                        window.location.href = '/dashboard/';
                    }, 1000);
                } else {
                    mensaje.textContent = datos.error || 'Usuario o contraseña incorrectos.';
                    mensaje.className = 'error';
                }

            } catch (error) {
                mensaje.textContent = 'No se pudo conectar con el servidor. Intente nuevamente.';
                mensaje.className = 'error';
            }
        });
    </script>

</body>
</html>
