<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Clínico</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .dashboard-container {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 600px;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        /* Encabezado */
        .dashboard-header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .badge-dashboard {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            background-color: var(--primary-light);
            padding: 4px 10px;
            border-radius: 9999px;
            margin-bottom: 8px;
        }

        .dashboard-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .dashboard-header p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Tarjetas de métricas (KPIs) */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .stat-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .stat-icon {
            font-size: 1.25rem;
            background-color: var(--primary-light);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .stat-number {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        /* Sección de navegación */
        .modules-section {
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .modules-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
        }

        .btn-module {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            text-decoration: none;
            background-color: var(--primary);
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.15s;
        }

        .btn-module:hover {
            background-color: var(--primary-hover);
        }

        .btn-module-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-module-arrow {
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .btn-module:hover .btn-module-arrow {
            transform: translateX(4px);
        }

        @media (max-width: 480px) {
            .dashboard-container {
                padding: 24px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <main class="dashboard-container">
        <header class="dashboard-header">
            <span class="badge-dashboard">Dashboard</span>
            <h2>¡Bienvenido!</h2>
            <p>Resumen general de registros del sistema clínico.</p>
        </header>

        <section class="stats-grid" aria-label="Estadísticas del sistema">
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Pacientes totales</span>
                    <span class="stat-icon" aria-hidden="true">👥</span>
                </div>
                <strong class="stat-number">{{ total_pacientes }}</strong>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Fichas totales</span>
                    <span class="stat-icon" aria-hidden="true">📋</span>
                </div>
                <strong class="stat-number">{{ total_fichas }}</strong>
            </div>
        </section>

        <nav class="modules-section">
            <span class="modules-title">Accesos rápidos</span>
            <a href="{% url 'listar_paciente' %}" class="btn-module">
                <span class="btn-module-left">
                    <span aria-hidden="true">😷</span>
                    <span>Gestionar Pacientes</span>
                </span>
                <span class="btn-module-arrow" aria-hidden="true">→</span>
            </a>
        </nav>
    </main>

</body>
</html>
